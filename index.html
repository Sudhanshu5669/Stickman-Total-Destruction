<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Stickman Ascension</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #14161c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0f14;
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        cursor: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 40%, #2a3350, #0d0f14 70%);
        color: #e9edf7;
        z-index: 10;
        transition: opacity 0.45s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot h1 {
        font-size: clamp(32px, 7vw, 74px);
        letter-spacing: 0.14em;
        font-weight: 900;
        text-transform: uppercase;
        text-shadow: 0 6px 0 rgba(0, 0, 0, 0.45);
      }
      #boot p { opacity: 0.6; letter-spacing: 0.25em; font-size: 13px; text-transform: uppercase; }
      .bar { width: min(340px, 70vw); height: 6px; border-radius: 99px; background: rgba(255,255,255,0.12); overflow: hidden; }
      .bar i { display: block; height: 100%; width: 30%; border-radius: 99px; background: #ffd23f; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-110%);} 100% { transform: translateX(360%);} }
      #boot .err { color: #ff8a7a; font-size: 13px; letter-spacing: 0; text-transform: none; max-width: 60ch; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot">
      <h1>Stickman Ascension</h1>
      <p id="boot-msg">Loading physics&hellip;</p>
      <div class="bar"><i></i></div>
      <div class="err" id="boot-err"></div>
    </div>
    <!--
      CrazyGames SDK. Loaded ahead of the game module and deliberately *not* awaited:
      `src/platform/portal.ts` polls for the global and gives up after a couple of
      seconds, so a blocked or 404ing script costs a short delay on the portal and
      nothing at all anywhere else. The game never depends on it being there.
    -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
