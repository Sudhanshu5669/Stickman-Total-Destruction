<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Stickman Total Destruction</title>
    <meta name="description" content="Load a piano. Aim at a building. Pull. A 2D ragdoll physics sandbox where every collapse is simulated." />
    <meta name="theme-color" content="#0d0f14" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #14161c;
        --gold: #ffd23f;
        --cream: #f4f1e8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0f14;
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        cursor: none;
      }

      /*
        The loading screen.

        This is the first thing anybody sees, and on a portal it is often the only
        thing they see before deciding — so it sells the game rather than reporting
        on it. A skyline, something heavy falling into it, and the name.

        Everything is CSS: no images, no fonts to fetch, nothing that can fail to
        load. The whole screen is inert once `.gone` lands, and the animations stop
        entirely for anyone who has asked them to.
      */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 120% 80% at 50% 18%, #38406a 0%, #1a1e30 45%, #0d0f14 100%);
        color: var(--cream);
        z-index: 10;
        transition: opacity 0.45s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }

      /* Ground plane and skyline, drawn with gradients so there is nothing to fetch. */
      #boot::after {
        content: "";
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 26%;
        background:
          linear-gradient(to bottom, #0b0d12 0%, #0b0d12 100%);
        clip-path: polygon(
          0% 42%, 6% 42%, 6% 20%, 13% 20%, 13% 48%, 21% 48%, 21% 8%, 27% 8%,
          27% 38%, 36% 38%, 36% 26%, 43% 26%, 43% 52%, 52% 52%, 52% 14%, 59% 14%,
          59% 44%, 68% 44%, 68% 30%, 75% 30%, 75% 50%, 83% 50%, 83% 18%, 90% 18%,
          90% 46%, 100% 46%, 100% 100%, 0% 100%
        );
        z-index: 0;
      }

      /* A grand piano's worth of mass, on its way down. */
      .faller {
        position: absolute;
        top: -14vh;
        left: 50%;
        width: clamp(26px, 4vw, 46px);
        height: clamp(26px, 4vw, 46px);
        border-radius: 4px;
        background: linear-gradient(150deg, #4a5262, #232833);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.16), 0 8px 22px rgba(0, 0, 0, 0.5);
        animation: drop 3.4s cubic-bezier(0.5, 0, 0.85, 0.4) infinite;
        z-index: 0;
      }
      .faller:nth-child(2) { left: 22%; animation-delay: 0.9s; animation-duration: 4.1s; }
      .faller:nth-child(3) { left: 74%; animation-delay: 2.1s; animation-duration: 3.7s; }
      @keyframes drop {
        0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
        12%  { opacity: 1; }
        100% { transform: translateY(105vh) rotate(340deg); opacity: 1; }
      }

      #boot > *:not(.faller) { position: relative; z-index: 1; }

      .wordmark { text-align: center; line-height: 0.92; }
      .wordmark .small {
        display: block;
        font-size: clamp(15px, 2.6vw, 26px);
        letter-spacing: 0.42em;
        font-weight: 900;
        text-indent: 0.42em;
        opacity: 0.85;
      }
      .wordmark .big {
        display: block;
        font-size: clamp(34px, 8.4vw, 92px);
        letter-spacing: 0.02em;
        font-weight: 900;
        color: var(--gold);
        text-shadow:
          0 4px 0 rgba(0, 0, 0, 0.5),
          0 0 38px rgba(255, 210, 63, 0.28);
      }
      .tagline {
        font-size: clamp(11px, 1.5vw, 14px);
        letter-spacing: 0.2em;
        font-weight: 800;
        text-transform: uppercase;
        opacity: 0.55;
        text-align: center;
        padding: 0 16px;
      }

      #boot-msg {
        opacity: 0.45;
        letter-spacing: 0.24em;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .bar {
        width: min(340px, 66vw);
        height: 8px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .bar i {
        display: block;
        height: 100%;
        width: 34%;
        border-radius: 99px;
        background: linear-gradient(90deg, rgba(255, 210, 63, 0.2), var(--gold), rgba(255, 210, 63, 0.2));
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide { 0% { transform: translateX(-110%);} 100% { transform: translateX(360%);} }

      #boot .err {
        color: #ff8a7a;
        font-size: 13px;
        letter-spacing: 0;
        text-transform: none;
        max-width: 60ch;
        text-align: center;
        padding: 0 16px;
      }

      @media (prefers-reduced-motion: reduce) {
        .faller { display: none; }
        .bar i { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot">
      <div class="faller"></div>
      <div class="faller"></div>
      <div class="faller"></div>
      <h1 class="wordmark">
        <span class="small">Stickman</span>
        <span class="big">TOTAL DESTRUCTION</span>
      </h1>
      <p class="tagline">Load a piano. Aim at a building. Pull.</p>
      <p id="boot-msg">Loading physics&hellip;</p>
      <div class="bar"><i></i></div>
      <div class="err" id="boot-err"></div>
    </div>
    <!--
      CrazyGames SDK. Loaded ahead of the game module and deliberately *not* awaited:
      `src/platform/portal.ts` polls for the global and gives up after a couple of
      seconds, so a blocked or 404ing script costs a short delay on the portal and
      nothing at all anywhere else. The game never depends on it being there.
    -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
