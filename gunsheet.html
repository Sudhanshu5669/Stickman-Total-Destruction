<!doctype html><meta charset=utf-8><title>Arsenal contact sheet</title>
<style>
 body{background:#5a7a4e;color:#f4f1e8;font:14px "Trebuchet MS",sans-serif;margin:0;padding:24px}
 h1{font-size:18px;letter-spacing:.08em;margin:0 0 6px}
 p.note{margin:0 0 18px;opacity:.7;font-size:12px}
 .row{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid #262c38}
 .name{width:150px;font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#ffd23f}
 .cell{display:flex;align-items:center;justify-content:center;min-width:0}
 .lbl{width:54px;font-size:10px;opacity:.55;text-transform:uppercase;letter-spacing:.08em}
 canvas{image-rendering:pixelated}
 .scroll{overflow-x:auto;flex:1}
</style>
<div id=out></div>
<script type="module">
import { gunSprite } from "/src/render/gunart.ts";
import { ammoSprite } from "/src/render/ammoart.ts";
import { AMMO } from "/src/weapons/ammo.ts";

const out = document.getElementById("out");
out.innerHTML = "<h1>ARSENAL — pixel art contact sheet</h1>"
  + "<p class=note>Each round: the gun, then the payload it fires. Both at 3x, one palette, one pixel size.</p>";

const zoom = 3;
function view(sprite) {
  const c = document.createElement("canvas");
  c.width = sprite.width * zoom; c.height = sprite.height * zoom;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.drawImage(sprite, 0, 0, c.width, c.height);
  return c;
}

for (const a of AMMO) {
  const row = document.createElement("div");
  row.className = "row";
  const n = document.createElement("div");
  n.className = "name"; n.textContent = a.name;
  row.appendChild(n);

  const gun = gunSprite(a.id, a.tint);
  const gw = document.createElement("div");
  gw.className = "cell";
  gw.appendChild(gun ? view(gun) : Object.assign(document.createElement("span"), { textContent: "— no art —" }));
  row.appendChild(gw);

  const lbl = document.createElement("div");
  lbl.className = "lbl"; lbl.textContent = "fires";
  row.appendChild(lbl);

  const ammo = ammoSprite(a.id, 0);
  const aw = document.createElement("div");
  aw.className = "cell scroll";
  aw.appendChild(ammo ? view(ammo) : Object.assign(document.createElement("span"), { textContent: "— ragdoll —" }));
  row.appendChild(aw);

  out.appendChild(row);
}
</script>
